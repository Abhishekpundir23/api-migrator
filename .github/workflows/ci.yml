name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run audit:dependencies

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_MIGRATOR_DB_PATH: /tmp/api-migrator-ci.db
      OPERATOR_USERNAME: ci-operator
      OPERATOR_PASSWORD: ci-only-password
      OPERATOR_APPROVAL_SECRET: ci-only-approval-secret-32-bytes-minimum
      API_MIGRATOR_DOCKER_TEST: "1"
      API_MIGRATOR_GITHUB_METADATA_POLICY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Admit disposable metadata-policy fixture host
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          if ! command -v nft >/dev/null; then
            sudo -n timeout --kill-after=5s 120 apt-get update
            sudo -n timeout --kill-after=5s 120 apt-get install -y --no-install-recommends nftables
          fi
      - run: npm run ci
      - name: Independently clean and audit owned metadata policy
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: node ops/gcp-trial/test/batch-image-metadata-policy.mjs --cleanup

  runner-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run runner:image:build
      - name: Verify real Docker timeout and failure cleanup
        run: |
          FIXTURE_TEST_IMAGE=$(docker image inspect --format '{{.Id}}' api-migrator-runner:local) \
            node --test ops/publication-runner/image/test/docker-fixture-executor-docker.mjs
      - run: npm run runner:image:verify
      - run: npm run runner:image:integration
