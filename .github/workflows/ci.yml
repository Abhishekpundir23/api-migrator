name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_MIGRATOR_DB_PATH: /tmp/api-migrator-ci.db
      OPERATOR_USERNAME: ci-operator
      OPERATOR_PASSWORD: ci-only-password
      OPERATOR_APPROVAL_SECRET: ci-only-approval-secret-32-bytes-minimum
      API_MIGRATOR_DOCKER_TEST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci
